[package]
name = "makima-ui"
version.workspace = true
edition.workspace = true

[dependencies]
makima-domain = { workspace = true }
makima-agent = { workspace = true }
makima-config = { workspace = true }
makima-commands = { workspace = true }
makima-highlight = { workspace = true }
makima-markdown = { workspace = true }
makima-match = { workspace = true }
makima-providers = { workspace = true }
makima-lua = { workspace = true }
makima-storage = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
syntect = { workspace = true }
unicode-width = { workspace = true }
serde_json = { workspace = true }
arboard = { workspace = true }
jiff = { workspace = true }
smol = { workspace = true }
flume = { workspace = true }
async-lock = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
arc-swap = { workspace = true }
futures-lite = { workspace = true }
wait-timeout = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }
ratatui-image = { workspace = true }
base64 = { workspace = true }
nucleo = { workspace = true }
nucleo-matcher = { workspace = true }
ignore = { workspace = true }
async-process = { workspace = true }
libc = { workspace = true }
strum = { workspace = true }
termini = { workspace = true }
notify = { workspace = true }
tempfile = { workspace = true }
shell-words = { workspace = true }
open = { workspace = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
makima-providers = { workspace = true, features = ["test-util"] }
makima-agent = { workspace = true, features = ["test-util"] }
makima-config = { workspace = true, features = ["test-util"] }
makima-lua = { workspace = true, features = ["test-support"] }
makima-storage = { workspace = true, features = ["test-util"] }
test-case = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "splash"
harness = false

[[bench]]
name = "wrap"
harness = false

[[bench]]
name = "reflow"
harness = false
