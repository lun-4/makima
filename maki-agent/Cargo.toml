[package]
name = "maki-agent"
version.workspace = true
edition.workspace = true

[dependencies]
maki-providers = { workspace = true }
maki-config = { workspace = true }
maki-commands = { workspace = true }
maki-match = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ignore = { workspace = true }
strum = { workspace = true }
maki-storage = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
similar = { workspace = true }
jsonrepair = { workspace = true }
jiff = { workspace = true }
humantime = { workspace = true }
smol = { workspace = true }
async-process = { workspace = true }
flume = { workspace = true }
arc-swap = { workspace = true }
bitflags = { workspace = true }
event-listener = { workspace = true }
async-lock = { workspace = true }
async-io = { workspace = true }
futures-lite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
isahc = { workspace = true }
libc = { workspace = true }
open = { workspace = true }
sha2 = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
maki-config = { workspace = true, features = ["test-util"] }
test-case = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "offload_perf"
harness = false

