# Lunared theme for Makima
# Accentuated red over a warm near-black background
# Syntax scopes are Helix-compatible (can use Helix theme files directly)
#
# Palette colors are used directly in UI code for simple fg/bg styling.
# Only styles that need modifiers or non-obvious color combos go in [ui].
# Derived colors: background_dim = darken(background, 10%), comment_light = lighten(comment, 30%)

"comment"                         = { fg = "comment" }
"comment.block"                   = { fg = "comment" }
"comment.block.documentation"     = { fg = "comment" }
"comment.line"                    = { fg = "comment" }
"comment.line.documentation"      = { fg = "comment" }

"constant"                        = { fg = "peach" }
"constant.builtin"                = { fg = "crimson" }
"constant.builtin.boolean"        = { fg = "crimson" }
"constant.character"              = { fg = "peach" }
"constant.character.escape"       = { fg = "red" }
"constant.macro"                  = { fg = "peach" }
"constant.numeric"                = { fg = "amber" }
"constructor"                     = { fg = "rose" }

"error"                           = { fg = "red" }
"warning"                         = { fg = "amber" }
"info"                            = { fg = "rose" }
"hint"                            = { fg = "crimson" }

"diff.delta"                      = { fg = "amber" }
"diff.minus"                      = { fg = "red" }
"diff.plus"                       = { fg = "rose" }

"function"                        = { fg = "rose" }
"function.builtin"                = { fg = "rose" }
"function.call"                   = { fg = "rose" }
"function.macro"                  = { fg = "crimson" }
"function.method"                 = { fg = "rose" }

"keyword"                         = { fg = "red" }
"keyword.control.conditional"     = { fg = "red" }
"keyword.control.exception"       = { fg = "crimson" }
"keyword.control.import"          = { fg = "red" }
"keyword.control.repeat"          = { fg = "red" }
"keyword.directive"               = { fg = "rose" }
"keyword.function"                = { fg = "red" }
"keyword.operator"                = { fg = "red" }
"keyword.return"                  = { fg = "red", modifiers = ["bold"] }
"keyword.storage"                 = { fg = "red" }
"keyword.storage.modifier"        = { fg = "red" }
"keyword.storage.type"            = { fg = "crimson", modifiers = ["italic"] }

"label"                           = { fg = "peach" }
"attribute"                       = { fg = "peach", modifiers = ["italic"] }
"namespace"                       = { fg = "foreground" }
"annotation"                      = { fg = "peach" }

"markup.bold"                     = { fg = "red", modifiers = ["bold"] }
"markup.heading"                  = { fg = "red", modifiers = ["bold"] }
"markup.italic"                   = { fg = "rose", modifiers = ["italic"] }
"markup.link.text"                = { fg = "rose" }
"markup.link.url"                 = { fg = "peach", modifiers = ["italic"] }
"markup.list"                     = { fg = "red" }
"markup.quote"                    = { fg = "peach", modifiers = ["italic"] }
"markup.raw"                      = { fg = "foreground" }
"markup.strikethrough"            = { modifiers = ["crossed_out"] }

"punctuation"                     = { fg = "foreground" }
"punctuation.bracket"             = { fg = "foreground" }
"punctuation.delimiter"           = { fg = "foreground" }
"punctuation.special"             = { fg = "red" }

"special"                         = { fg = "crimson" }

"string"                          = { fg = "peach" }
"string.regexp"                   = { fg = "red" }
"string.special"                  = { fg = "crimson" }
"string.symbol"                   = { fg = "amber" }

"tag"                             = { fg = "red" }
"tag.attribute"                   = { fg = "rose" }
"tag.delimiter"                   = { fg = "foreground" }

"type"                            = { fg = "rose", modifiers = ["italic"] }
"type.builtin"                    = { fg = "crimson" }
"type.enum.variant"               = { fg = "amber" }

"variable"                        = { fg = "foreground" }
"variable.builtin"                = { fg = "crimson", modifiers = ["italic"] }
"variable.other"                  = { fg = "foreground" }
"variable.other.member"           = { fg = "rose_muted" }
"variable.parameter"              = { fg = "amber", modifiers = ["italic"] }

[palette]
background   = "#120c0c"
foreground   = "#e9dede"
comment      = "#7a5c5c"
red          = "#ff4545"
crimson      = "#e03030"
rose         = "#ff8080"
rose_muted   = "#c99b9b"
peach        = "#ffb08a"
amber        = "#e8b06a"
current_line = "#241818"
selection    = "#331d1d"

[ui]
user               = { fg = "rose" }
assistant          = { fg = "foreground" }
assistant_prefix   = { fg = "red" }
thinking           = { fg = "comment", modifiers = ["italic"] }
tool_bg            = { bg = "#0e0909" }
tool               = { fg = "foreground" }
tool_path          = { fg = "peach" }
tool_annotation    = { fg = "comment" }
tool_prefix        = { fg = "foreground", modifiers = ["bold"] }
tool_success       = { fg = "rose" }
tool_error         = { fg = "red" }
tool_dim           = { fg = "comment" }
error              = { fg = "red" }
status_dim         = { fg = "comment" }
strikethrough      = { fg = "comment", modifiers = ["crossed_out"] }
plan_rule          = { fg = "red", modifiers = ["bold"] }
code_block         = { fg = "foreground" }
horizontal_rule    = { fg = "comment" }
table_border       = { fg = "comment" }
diff_old           = { bg = "#3d1414" }
diff_new           = { bg = "#241c14" }
diff_old_emphasis  = { bg = "#542020" }
diff_new_emphasis  = { bg = "#33261a" }
diff_line_nr       = { fg = "comment" }
todo_completed     = { fg = "rose" }
todo_in_progress   = { fg = "amber" }
todo_pending       = { fg = "comment" }
todo_cancelled     = { fg = "red", modifiers = ["crossed_out"] }
item_selected      = { fg = "foreground", bg = "selection" }
item               = { fg = "rose" }
item_desc          = { fg = "comment" }
accent             = { fg = "peach" }
panel_border       = { fg = "crimson" }
panel_title        = { fg = "red", modifiers = ["bold"] }
cursor             = { fg = "background", bg = "foreground" }
keybind_key        = { fg = "rose", modifiers = ["bold"] }
keybind_section    = { fg = "red", modifiers = ["bold"] }
input_border       = { fg = "comment" }
keybind_desc       = { fg = "foreground" }
queue              = { fg = "crimson" }
plan_path          = { fg = "peach", modifiers = ["bold"] }
status_notice      = { fg = "peach" }
status_retry_error = { fg = "red" }
status_retry_info  = { fg = "comment" }
input_placeholder  = { fg = "comment" }
queue_delete       = { fg = "red", modifiers = ["bold"] }
timestamp          = { fg = "comment" }
spinner            = { fg = "red" }
active             = { fg = "rose" }
