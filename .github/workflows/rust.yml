name: Rust

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - "Cargo.toml"
              - "Cargo.lock"
              - "src/**"
              - "maki-*/src/**"
              - "maki-*/benches/**"
              - "maki-*/tests/**"
              - "plugins/**"
              - "justfile"
              - ".github/workflows/rust.yml"

  fmt:
    name: Format (Rust)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  fmt-lua:
    name: Format (Lua)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      STYLUA_VERSION: v2.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install stylua
        run: |
          .github/scripts/retry.sh curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          unzip -o stylua.zip stylua
          rm stylua.zip
      - run: ./stylua --check plugins/

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # The runner ships libssl-dev, so skip the two minute vendored OpenSSL
      # build on a cache miss. Windows has none and keeps vendoring.
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just lint

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - run: sudo apt-get -o Acquire::Retries=5 install -y ripgrep
      - run: just test
      # Lives here to reuse the warm target dir instead of building the graph twice.
      - run: just gen-docs-check

  machete:
    name: Unused deps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      OPENSSL_NO_VENDOR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just build

  windows:
    name: Lint + Offload Tests + Build (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Verify file and directory symlink privileges
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            $file = Join-Path $root 'target.txt'
            $directory = Join-Path $root 'target-dir'
            Set-Content -LiteralPath $file -Value 'probe'
            New-Item -ItemType Directory -Path $directory | Out-Null
            foreach ($target in @($file, $directory)) {
              $link = "$target-link"
              New-Item -ItemType SymbolicLink -Path $link -Target $target -ErrorAction Stop | Out-Null
              $attributes = [IO.File]::GetAttributes($link)
              if (($attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
                throw "Symlink probe did not create a reparse point: $link"
              }
            }
          } catch {
            throw "Offload tests require symlink privileges: $($_.Exception.Message)"
          } finally {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
      - run: cargo test -p maki-agent --lib tools::offload
      - run: cargo test -p maki-storage --lib sessions::tests::delete
      - run: just lint
      - run: just build

  ci-pass:
    name: CI
    if: always()
    needs: [fmt, fmt-lua, lint, test, machete, build, windows]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
